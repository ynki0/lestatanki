<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет клиента — Good Boost</title>
  <meta name="description" content="Личный кабинет клиента Good Boost для просмотра профиля, заказов и создания новых заявок.">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,max-image-preview:none">
  <link rel="canonical" href="https://goodboost.top/client">
  <link rel="icon" type="image/png" sizes="640x640" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/css/main.css?v=20260413-split-1">
  <link rel="stylesheet" href="/css/pages/dashboard.css?v=20260413-split-1">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="page-shell">
    <div data-partial="/partials/navbar.html"></div>

    <main class="page-main page-main--offset">
      <div class="container admin-page-main">
        <div class="dashboard">
      <div class="mobile-sidebar-toggle" onclick="toggleSidebar('dashSidebar')">
        <i data-lucide="menu"></i> Меню
      </div>
      <div class="sidebar-overlay hidden" id="dashOverlay" onclick="toggleSidebar('dashSidebar')"></div>
      <div class="dash-container">
        <aside class="dash-sidebar" id="dashSidebar">
          <div class="user-info">
            <h4 id="dashUserName">Пользователь</h4>
            <p id="dashUserEmail">user@mail.ru</p>
          </div>
          <nav class="dash-nav">
            <a href="#" class="active" data-section="dash-orders">
              <span class="nav-icon"><i data-lucide="package"></i></span> Мои заказы
            </a>
            <a href="#" data-section="dash-profile">
              <span class="nav-icon"><i data-lucide="user"></i></span> Профиль
            </a>
            <a href="/" class="push-bottom">
              <span class="nav-icon"><i data-lucide="log-out"></i></span> Выйти
            </a>
          </nav>
        </aside>

        <main class="dash-main">
          <div class="dash-section active" id="dash-orders">
            <h1>Мои заказы</h1>
            <p class="subtitle">Отслеживайте статус ваших заказов</p>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Услуга</th>
                    <th>Детали</th>
                    <th>Сумма</th>
                    <th>Оплата</th>
                    <th>Статус</th>
                    <th>Дата</th>
                  </tr>
                </thead>
                <tbody id="userOrdersBody">
                  <tr><td colspan="7" class="table-cell-center text-gray">Заказов пока нет</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="dash-section" id="dash-profile">
            <h1>Профиль</h1>
            <p class="subtitle">Управляйте своими данными</p>
            <div class="calc-wrapper calc-wrapper-narrow">
              <div class="alert alert-success" id="profileSuccess"></div>
              <form id="profileForm">
                <div class="form-group">
                  <label for="profileName">Имя</label>
                  <input type="text" class="form-control" id="profileName" required title="Введите имя профиля">
                </div>
                <button type="submit" class="btn btn-gold btn-block">Сохранить</button>
              </form>
            </div>
          </div>

          <div class="dash-section" id="dash-new-order">
            <h1>Новый заказ</h1>
            <p class="subtitle">Оформите заказ на услугу</p>
            <div class="calc-wrapper calc-wrapper-narrow">
              <div class="alert alert-success" id="newOrderSuccess"></div>
              <div class="alert alert-error" id="newOrderError"></div>
              <form id="newOrderForm">
                <div class="form-group">
                  <label for="orderService">Услуга</label>
                  <select class="form-control" id="orderService" required title="Выберите услугу для заказа">
                    <option value="">— Выберите —</option>
                    <option value="Прокачка WN8">Прокачка WN8 — 500 ₽ / 100 ед.</option>
                    <option value="Прокачка % побед">Прокачка % побед — 1 500 ₽ / 1%</option>
                    <option value="Фарм серебра">Фарм серебра — 3 000 ₽ / 1 млн</option>
                    <option value="Выполнение ЛБЗ">Выполнение ЛБЗ — 5 000 ₽ / задача</option>
                    <option value="Прокачка ветки">Прокачка ветки X ур. — 15 000 ₽</option>
                    <option value="Наградной танк">Наградной танк — 25 000 ₽</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Детали / комментарий</label>
                  <textarea class="form-control" id="orderDetails" rows="4" placeholder="Опишите подробности..."></textarea>
                </div>
                <button type="submit" class="btn btn-gold btn-block">Оформить заказ</button>
              </form>
            </div>
          </div>

        </main>
      </div>
        </div>
      </div>
    </main>

    <div data-partial="/partials/footer.html"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/client.js"></script>
  <script src="/js/chat.js"></script>
  <script>
    document.addEventListener('auth:checked', () => {
      if (typeof loadDashboard === 'function') loadDashboard();
    });
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
