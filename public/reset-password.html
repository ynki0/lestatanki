<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля — Good Boost</title>
  <meta name="description" content="Страница восстановления и установки нового пароля для аккаунта Good Boost.">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,max-image-preview:none">
  <link rel="canonical" href="https://goodboost.top/reset-password">
  <link rel="icon" type="image/png" sizes="640x640" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/css/main.css?v=20260413-split-1">
  <link rel="stylesheet" href="/css/pages/auth.css?v=20260413-reset-1">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="page-shell">
    <div data-partial="/partials/navbar.html"></div>

    <main class="page-main page-main--offset page-main--centered">
      <div class="container auth-page-main">
        <div class="auth-page">
          <div class="auth-card">
            <h2>Новый пароль</h2>
            <p class="subtitle">Укажите новый пароль для вашего аккаунта</p>
            <div class="alert alert-error" id="resetPasswordError"></div>
            <div class="alert alert-success" id="resetPasswordSuccess"></div>
            <form id="resetPasswordForm">
              <div class="form-group">
                <label for="resetPassword">Новый пароль</label>
                <input type="password" class="form-control" id="resetPassword" placeholder="Минимум 6 символов" required>
              </div>
              <div class="form-group">
                <label for="resetPasswordRepeat">Повторите пароль</label>
                <input type="password" class="form-control" id="resetPasswordRepeat" placeholder="Повторите пароль" required>
              </div>
              <button type="submit" class="btn btn-gold btn-block">Сохранить новый пароль</button>
            </form>
            <div class="auth-footer">
              Вспомнили пароль? <a href="/login">Вернуться ко входу</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div data-partial="/partials/footer.html"></div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/reset-password.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
